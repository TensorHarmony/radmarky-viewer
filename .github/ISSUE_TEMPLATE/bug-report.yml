name: Bug report
description: Report a reproducible problem in RadMarky Viewer
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach patient-identifiable medical data, clinical binaries, or source files containing protected health information. Use synthetic or properly de-identified examples only.

  - type: input
    id: version
    attributes:
      label: RadMarky Viewer version
      description: Find this in Help > About RadMarky Viewer.
      placeholder: 1.0.0-rc.1
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Release installer
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its effect.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use the smallest reliable sequence you can.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots made from synthetic or de-identified data, or other relevant details.

  - type: checkboxes
    id: checks
    attributes:
      label: Data-safety checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no patient-identifiable medical data or protected health information.
          required: true
